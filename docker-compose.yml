version: "3.9"

# ─── Keycloak for local development ────────────────────────────────────────────
#
#  Keycloak  → http://localhost:8180        (admin: admin / admin)
#  Spring Boot stays on               8080
#  Vite dev server stays on           5173
#
#  On first start the realm-import file is loaded automatically,
#  creating the realm, client, and roles. You only need to create
#  test users manually (see KEYCLOAK.md).
#
# ───────────────────────────────────────────────────────────────────────────────

services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: INFO
    ports:
      - "8180:8180"
    volumes:
      # Realm export is imported on first start-dev run
      - ./keycloak/bank-management-realm.json:/opt/keycloak/data/import/bank-management-realm.json:ro
      # Persist Keycloak H2 data between restarts (dev only)
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
