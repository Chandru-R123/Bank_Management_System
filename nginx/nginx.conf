# =============================================================================
# NGINX — API Gateway & Single Entry Point
# State Bank Management System
#
# Browser → NGINX :8080
#   /       → React frontend
#   /api/   → Spring Boot backend
#   /auth/  → Keycloak
#   /mail/  → MailHog
# =============================================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # ACCESS LOG FORMAT
    # =========================================================================

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    log_format gateway
        '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
        'rid=$request_id upstream=$upstream_addr '
        'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/gateway.log gateway;


    # =========================================================================
    # GENERAL NGINX SETTINGS
    # =========================================================================

    sendfile on;

    keepalive_timeout 65;

    client_max_body_size 10m;


    # =========================================================================
    # RATE LIMITING
    # =========================================================================
    #
    # Each client IP gets its own rate-limit bucket.
    #
    # api_limit:
    #   Normal API traffic
    #   10 requests/second per IP
    #
    # burst=20 below allows short traffic bursts without immediately
    # rejecting them.
    #
    # Excess requests receive:
    #   HTTP 429 Too Many Requests
    #
    # =========================================================================

    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;


    # =========================================================================
    # UPSTREAM SERVICES
    # =========================================================================

    upstream backend {
        server backend:8080;
    }

    upstream keycloak {
        server keycloak:8180;
    }

    upstream mailhog {
        server mailhog:8025;
    }


    # =========================================================================
    # MAIN SERVER
    # =========================================================================

    server {

        listen 8080;

        server_name localhost;


        # =====================================================================
        # /api/ → SPRING BOOT BACKEND
        # =====================================================================

        location /api/ {

            # -------------------------------------------------------------
            # RATE LIMITING
            # -------------------------------------------------------------
            #
            # Maximum normal rate:
            #     10 requests / second / IP
            #
            # Short burst:
            #     up to 20 requests
            #
            # Requests beyond the allowed rate receive:
            #     429 Too Many Requests
            #
            limit_req zone=api_limit burst=20 nodelay;


            # -------------------------------------------------------------
            # SPRING BOOT PROXY
            # -------------------------------------------------------------

            proxy_pass http://backend/api/;

            proxy_http_version 1.1;


            # -------------------------------------------------------------
            # REQUEST ID / CORRELATION ID
            # -------------------------------------------------------------

            proxy_set_header X-Request-ID $request_id;

            add_header X-Request-ID $request_id always;

            add_header X-Gateway "state-bank-nginx" always;


            # -------------------------------------------------------------
            # FORWARDED HEADERS
            # -------------------------------------------------------------

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header X-Forwarded-Port $server_port;


            # -------------------------------------------------------------
            # TIMEOUTS
            # -------------------------------------------------------------

            proxy_read_timeout 120s;

            proxy_connect_timeout 10s;
        }


        # =====================================================================
        # /auth/ → KEYCLOAK
        # =====================================================================

        location /auth/ {

            proxy_pass http://keycloak/;

            proxy_http_version 1.1;

            proxy_set_header Host $host:$server_port;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Forwarded
                "for=$remote_addr;host=$host;proto=$scheme";


            # -------------------------------------------------------------
            # KEYCLOAK BUFFER SETTINGS
            # -------------------------------------------------------------

            proxy_buffer_size 128k;

            proxy_buffers 4 256k;

            proxy_busy_buffers_size 256k;

            proxy_read_timeout 120s;
        }


        # =====================================================================
        # /mail/ → MAILHOG
        # =====================================================================

        location = /mail {

            return 301 /mail/;
        }


        location /mail/ {

            proxy_pass http://mailhog;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            # -------------------------------------------------------------
            # WEBSOCKET
            # -------------------------------------------------------------

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
        }


        # =====================================================================
        # / → REACT SPA
        # =====================================================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files $uri $uri/ /index.html;


            # -------------------------------------------------------------
            # SECURITY HEADERS
            # -------------------------------------------------------------

            add_header X-Content-Type-Options "nosniff" always;

            add_header X-Frame-Options "SAMEORIGIN" always;

            add_header Referrer-Policy
                "strict-origin-when-cross-origin" always;
        }


        # =====================================================================
        # HEALTH CHECK
        # =====================================================================

        location /health {

            access_log off;

            return 200 '{"status":"UP"}';

            add_header Content-Type application/json;
        }


        # =====================================================================
        # ERROR PAGES
        # =====================================================================

        error_page 500 502 503 504 /50x.html;


        location = /50x.html {

            root /usr/share/nginx/html;
        }
    }
}