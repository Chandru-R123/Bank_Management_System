# =============================================================================
#  NGINX — API Gateway & Single Entry Point
#  State Bank Management System
#
#  Browser → NGINX :8080
#   /          → React frontend (built static files served by NGINX)
#   /api/      → Spring Boot backend  (Docker service: backend:8080)
#   /auth/     → Keycloak             (Docker service: keycloak:8180)
# =============================================================================

worker_processes auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Access log format ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Upstream services (Docker internal network) ───────────────────────────
    upstream backend {
        server backend:8080;
    }

    upstream keycloak {
        server keycloak:8180;
    }

    # ── Main server ───────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name localhost;

        # ── /api/ → Spring Boot ───────────────────────────────────────────────
        #
        #  The trailing slash on proxy_pass strips /api from the forwarded URI
        #  so Spring Boot receives /customers, /accounts etc. — matching its
        #  existing @RequestMapping("/api/...") paths exactly.
        #
        #  Strip /api prefix: proxy_pass http://backend/ forwards /api/customers
        #  as /customers to Spring Boot — but Spring Boot listens at /api/...
        #  So we keep /api in the forwarded path by NOT trailing-slashing.
        # ─────────────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;

            # Allow large request bodies (file uploads etc.)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── /auth/ → Keycloak ─────────────────────────────────────────────────
        #
        #  Keycloak's KC_HOSTNAME_URL is set to http://localhost:8080/auth,
        #  meaning its context root is already /auth.
        #  NGINX strips the /auth prefix and forwards the remainder,
        #  so /auth/realms/... → keycloak:8180/realms/...
        # ─────────────────────────────────────────────────────────────────────
        location /auth/ {
            proxy_pass         http://keycloak/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host:$server_port;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   Forwarded         "for=$remote_addr;host=$host;proto=$scheme";

            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;

            proxy_read_timeout 120s;
        }

        # ── / → React SPA (static files) ─────────────────────────────────────
        #
        #  try_files $uri $uri/ /index.html — serves the file if it exists,
        #  otherwise falls back to index.html so React hash/history routing
        #  works on browser refresh for routes like /customers, /accounts.
        # ─────────────────────────────────────────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Health check endpoint (used by Docker healthcheck) ────────────────
        location /health {
            access_log off;
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        # ── Error pages ───────────────────────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
