# ── Test overrides ────────────────────────────────────────────────────────────
#
#  Providing jwk-set-uri directly bypasses the OIDC discovery call that
#  NimbusJwtDecoder.withIssuerLocation() makes at context startup.
#  The URL is never actually fetched during a context-load test.
#
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/bank-management
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/bank-management/protocol/openid-connect/certs

# H2 in-memory database — no PostgreSQL required for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.security=WARN
