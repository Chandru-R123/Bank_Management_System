spring.application.name=bank-management

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
# Docker: uses service name "postgres" from docker-compose.yml
# Local dev override: set SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bankdb
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bank@123}

# ─── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Keycloak / OAuth2 Resource Server ────────────────────────────────────────
#
#  In Docker the backend validates JWTs using the INTERNAL Keycloak service URL
#  (keycloak:8180) — this is a container-to-container call, never goes through
#  NGINX. The "iss" claim in the JWT however is set by Keycloak to the URL the
#  BROWSER used to get the token (http://localhost:8080/auth/realms/bank-management).
#
#  To make Spring accept tokens issued via the NGINX-proxied URL we set:
#   issuer-uri  = the public URL the browser sees (via NGINX on :8080)
#   jwk-set-uri = the internal Docker URL for JWKS fetching (no NGINX hop)
#
#  This decouples "where to fetch keys" from "what issuer to accept".
#
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:http://localhost:8180/realms/bank-management}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_SET_URI:http://localhost:8180/realms/bank-management/protocol/openid-connect/certs}

# ─── Logging ───────────────────────────────────────────────────────────────────
# Every line carries the gateway request id: [rid:<X-Request-ID>]
logging.pattern.level=%5p [rid:%X{requestId:-}]
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG

# ─── Disable open-in-view warning ──────────────────────────────────────────────
spring.jpa.open-in-view=false

# ─── Keycloak Admin API (used by AdminSyncService to pull registered users) ───
# Internal Docker service URL — backend talks directly to Keycloak container
keycloak.admin.server-url=${KC_ADMIN_SERVER_URL:http://keycloak:8180}
keycloak.admin.realm=${KC_ADMIN_REALM:bank-management}
keycloak.admin.username=${KC_ADMIN_USERNAME:admin}
keycloak.admin.password=${KC_ADMIN_PASSWORD:admin}
# Client + landing page used in "set / reset your password" emails
keycloak.admin.client-id=${KC_CLIENT_ID:bank-management-backend}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080/}
# Give every customer with an email a Keycloak login at startup, so
# Keycloak's "Forgot password" can email them (see CustomerLoginBackfill)
app.backfill-customer-logins=${BACKFILL_CUSTOMER_LOGINS:true}

# ─── Banking rules ─────────────────────────────────────────────────────────────
# Minimum balance a SAVINGS account must keep after any debit (₹)
bank.savings.minimum-balance=${BANK_SAVINGS_MIN_BALANCE:1000}
# Largest single deposit / withdrawal / transfer a CUSTOMER may make online (₹)
bank.customer.max-transaction-amount=${BANK_MAX_TXN_AMOUNT:1000000}
# Total withdrawals + outgoing transfers a CUSTOMER may make per account per day (₹)
bank.customer.daily-debit-limit=${BANK_DAILY_DEBIT_LIMIT:200000}

# ─── CAPTCHA (Google reCAPTCHA v2 checkbox) ───────────────────────────────────
# Put CAPTCHA_SITE_KEY and CAPTCHA_SECRET_KEY in the .env file next to
# docker-compose.yml. CAPTCHA is ON when both keys are set (and
# CAPTCHA_ENABLED is not false); without keys everything works without it.
# The keys are also pushed to Keycloak's register page (KeycloakCaptchaSync).
captcha.enabled=${CAPTCHA_ENABLED:true}
captcha.site-key=${CAPTCHA_SITE_KEY:}
captcha.secret-key=${CAPTCHA_SECRET_KEY:}
captcha.verify-url=${CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}

# ─── KYC configuration ─────────────────────────────────────────────────────────
# KYC_PROVIDER: MANUAL (default) | DIGILOCKER | MOCK (dev only)
kyc.provider=${KYC_PROVIDER:MANUAL}
# Persistent directory for uploaded KYC documents — MUST be a Docker volume in prod
kyc.upload-dir=${KYC_UPLOAD_DIR:./kyc-uploads}
# DigiLocker OAuth2 (required only when KYC_PROVIDER=DIGILOCKER)
digilocker.client-id=${DIGILOCKER_CLIENT_ID:}
digilocker.redirect-uri=${DIGILOCKER_REDIRECT_URI:}
digilocker.auth-url=${DIGILOCKER_AUTH_URL:https://api.digitallocker.gov.in/public/oauth2/1/authorize}
digilocker.token-url=${DIGILOCKER_TOKEN_URL:https://api.digitallocker.gov.in/public/oauth2/1/token}

# ─── Multipart file uploads (for KYC documents) ───────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── Sample data seed flag ─────────────────────────────────────────────────────
app.seed-sample-data=${SEED_SAMPLE_DATA:true}
