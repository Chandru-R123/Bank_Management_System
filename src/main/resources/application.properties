spring.application.name=bank-management

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
spring.datasource.username=postgres
spring.datasource.password=bank@123

# ─── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Keycloak / OAuth2 Resource Server ────────────────────────────────────────
#
#  Spring uses this URI to:
#   1. Fetch the JWKS public keys  (issuer/.well-known/openid-configuration)
#   2. Validate the "iss" claim in every incoming JWT
#
#  Keycloak runs on port 8180 (docker-compose.yml) so Spring Boot stays on 8080.
#  Realm name must exactly match what you create in Keycloak.
#
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/bank-management

# ─── Logging (useful while wiring up Keycloak) ────────────────────────────────
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
